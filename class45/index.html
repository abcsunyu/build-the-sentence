<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Build a Sentence</title>
<style>
:root {
  --primary: #1b5e5a;
  --primary-soft: rgba(27, 94, 90, 0.1);
  --primary-light: rgba(27, 94, 90, 0.06);
  --ok: #16915a;
  --bad: #d64545;
  --text: #122033;
  --muted: #5f7086;
  --border: rgba(18, 32, 51, 0.12);
  --card-bg: #ffffff;
  --bg: #f6f8fb;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 100px;
}
button { font: inherit; cursor: pointer; border: none; background: none; }

/* ===== TOP BAR ===== */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--primary);
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 18px; color: #fff;
}
.brand { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
.right { display: flex; align-items: center; gap: 10px; }
.timer {
  min-width: 74px; text-align: center;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
  background: rgba(255,255,255,0.15);
  border-radius: 999px; padding: 6px 12px; font-size: 15px; font-weight: 600;
}
.btn-ghost {
  background: rgba(255,255,255,0.12);
  color: #fff; border-radius: 8px; padding: 7px 14px;
  font-size: 13px; font-weight: 500; transition: background 0.2s;
}
.btn-ghost:hover { background: rgba(255,255,255,0.22); }

/* ===== CONTAINER ===== */
.container { max-width: 860px; margin: 0 auto; padding: 24px 16px 36px; }

/* ===== VIEWS ===== */
.view { display: none; }
.view.active { display: block; }

/* ===== HOME / SECTION CARDS ===== */
.view-home h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.view-home .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
  padding: 20px; cursor: pointer; box-shadow: 0 4px 16px rgba(25,48,84,0.06);
  transition: border-color 0.2s, box-shadow 0.2s; text-align: left;
}
.card:hover { border-color: var(--primary); box-shadow: 0 6px 20px rgba(27,94,90,0.1); }
.card h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.card p { color: var(--muted); font-size: 14px; }
.card .tag-badge {
  display: inline-block; background: var(--primary-soft); color: var(--primary);
  font-size: 12px; padding: 2px 10px; border-radius: 999px; margin-top: 8px;
}

/* ===== MODE SWITCH ===== */
.mode-switch {
  display: flex; gap: 0; margin-bottom: 20px;
  background: #eef2f0; border-radius: 10px; padding: 3px; width: fit-content;
}
.mode-btn {
  padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 600;
  color: var(--muted); transition: all 0.2s;
}
.mode-btn.active { background: #fff; color: var(--primary); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.mode-btn:hover:not(.active) { color: var(--text); }

/* ===== PRACTICE ===== */
.practice-topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px;
}
.question-nav { display: flex; flex-wrap: wrap; gap: 6px; }
.nav-dot {
  min-width: 38px; height: 36px; padding: 0 8px; border-radius: 8px;
  border: 1px solid var(--border); background: #fff; font-size: 14px; font-weight: 700;
  transition: all 0.15s; display: flex; align-items: center; justify-content: center;
}
.nav-dot:hover { border-color: var(--primary); }
.nav-dot.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.nav-dot.done { border-color: rgba(22,145,90,0.35); color: var(--ok); background: rgba(22,145,90,0.06); }
.nav-dot.wrong { border-color: rgba(214,69,69,0.35); color: var(--bad); background: rgba(214,69,69,0.06); }
.tool-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.tool-btn {
  padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--border); background: #fff; transition: all 0.15s;
}
.tool-btn:hover { border-color: var(--primary); }
.tool-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.tool-btn.primary:hover { opacity: 0.9; }
.tool-btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.tool-btn.ghost:hover { color: var(--text); }

/* ===== DIALOGUE ===== */
.prompt {
  font-size: 26px; font-weight: 700; line-height: 1.4; margin-bottom: 8px;
  padding: 16px 20px; background: #fff; border-radius: 14px;
  border: 1px solid var(--border); min-height: 64px;
}
.template {
  font-size: 26px; font-weight: 700; line-height: 2.2; padding: 12px 20px;
  background: #fff; border-radius: 14px; border: 1px solid var(--border);
  min-height: 80px; user-select: none; -webkit-user-select: none;
}
.slot {
  display: inline-flex; align-items: flex-end; justify-content: center;
  min-width: 100px; min-height: 44px; margin: 0 3px; padding: 0 10px 3px;
  vertical-align: middle; border-bottom: 3px solid rgba(95,112,134,0.35);
  font-size: 26px; font-weight: 700; cursor: pointer; transition: border-color 0.15s;
}
.slot.filled { border-bottom-color: var(--primary); }
.slot.correct { color: var(--ok); border-bottom-color: var(--ok); }
.slot.wrong { color: var(--bad); border-bottom-color: var(--bad); }
.slot.drag-over { border-bottom-color: var(--primary); background: var(--primary-light); }

/* ===== CHOICES ===== */
.hint-text {
  font-size: 13px; color: var(--muted); margin: 8px 0 4px; padding: 0 4px;
}
.choices {
  min-height: 64px; padding: 8px 4px; display: flex; flex-wrap: wrap; gap: 10px;
  user-select: none; -webkit-user-select: none;
}
.chip {
  border: 1px solid var(--border); border-radius: 999px; background: #fff;
  padding: 11px 18px; font-size: 15px; font-weight: 600; cursor: grab;
  user-select: none; box-shadow: 0 2px 8px rgba(25,48,84,0.06);
  transition: all 0.15s; touch-action: none;
}
.chip:hover { border-color: rgba(27,94,90,0.4); }
.chip.selected { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.chip.hidden { display: none; }

/* ===== DRAG GHOST ===== */
.drag-ghost {
  position: fixed; z-index: 9999; pointer-events: none;
  border: 1px solid rgba(27,94,90,0.2); border-radius: 999px;
  background: rgba(255,255,255,0.96); box-shadow: 0 12px 28px rgba(25,48,84,0.16);
  padding: 11px 18px; font-size: 15px; font-weight: 600; white-space: nowrap;
}

/* ===== RESULT ===== */
.result {
  margin-top: 10px; min-height: 28px; font-size: 15px; font-weight: 600;
  padding: 8px 16px; border-radius: 10px; display: none;
}
.result.show { display: block; }
.result.ok { background: rgba(22,145,90,0.08); color: var(--ok); }
.result.bad { background: rgba(214,69,69,0.08); color: var(--bad); }

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .topbar { padding: 10px 14px; }
  .brand { font-size: 15px; }
  .container { padding: 16px 12px 28px; }
  .prompt { font-size: 20px; padding: 14px 16px; }
  .template { font-size: 20px; padding: 10px 14px; line-height: 2.0; }
  .slot { min-width: 72px; min-height: 36px; font-size: 20px; }
  .chip { padding: 9px 14px; font-size: 14px; }
  .nav-dot { min-width: 34px; height: 32px; font-size: 13px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">Build a Sentence</div>
  <div class="right">
    <div id="timer" class="timer">00:00</div>
    <button id="homeBtn" class="btn-ghost">返回首页</button>
  </div>
</header>

<main class="container">
  <!-- HOME VIEW -->
  <section id="viewHome" class="view active">
    <h1>选择练习</h1>
    <p class="sub">选择一个语法点或套题开始练习</p>
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="grammar">语法点</button>
      <button class="mode-btn" data-mode="test">套题</button>
    </div>
    <div id="sectionCards" class="cards"></div>
  </section>

  <!-- PRACTICE VIEW -->
  <section id="viewPractice" class="view">
    <div class="practice-topbar">
      <div id="questionNav" class="question-nav"></div>
      <div class="tool-btns">
        <button id="prevBtn" class="tool-btn">上一题</button>
        <button id="nextBtn" class="tool-btn">下一题</button>
        <button id="checkBtn" class="tool-btn primary">检查本题</button>
        <button id="submitBtn" class="tool-btn primary">提交整套</button>
        <button id="resetBtn" class="tool-btn ghost">重置本题</button>
      </div>
    </div>

    <div id="prompt" class="prompt">选择练习开始</div>
    <div id="template" class="template"></div>
    <div class="hint-text">桌面端拖动；移动端点击。点击已填入的语块可移除。</div>
    <div id="choices" class="choices"></div>
    <div id="result" class="result"></div>
  </section>
</main>

  // State

let itemIdx = 0;              // current item index within section

// ===== HELPERS =====
function shuffleArray(a) { const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]} return r; }

function countBlanks(tmpl) { return (tmpl.match(/_{3,}/g)||[]).length; }

function keyFor(section, idx) { return `${section}-${idx}`; }

function getItem() { return questions.find(q => q.id === sectionItems[itemIdx]); }

function ensureState() {
  const item = getItem(); if (!item) return [];
  const key = keyFor(currentSectionLabel, itemIdx);
  if (!answersState[key]) answersState[key] = Array(countBlanks(item.template)).fill(null);
  return answersState[key];
}

function fmtTime(sec) {
  const s = Math.max(0, sec|0);
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

function updateTimer() {
  if (mode === 'grammar') {
    if (questionStartTime === null) { el.timer.textContent = '00:00'; return; }
    const elapsed = Math.floor((Date.now() - questionStartTime) / 1000);
    el.timer.textContent = fmtTime(elapsed);
  } else {
    if (remaining === null) { el.timer.textContent = '06:50'; return; }
    const now = Math.floor((Date.now() - questionStartTime) / 1000);
    const left = Math.max(0, remaining - now);
    el.timer.textContent = fmtTime(left);
    if (left <= 0) {
      stopTimer();
      checkSectionAll(true);
    }
  }
}

function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

function startQuestionTimer() {
  stopTimer();
  questionStartTime = Date.now();
  updateTimer();
  timerId = setInterval(() => { updateTimer(); }, 1000);
}

function startCountdown() {
  stopTimer();
  remaining = 410;
  questionStartTime = Date.now();
  updateTimer();
  timerId = setInterval(() => { updateTimer(); }, 1000);
}

// ===== PARSE TEMPLATE =====
function parseTemplate(tmpl) {
  const raw = tmpl.split(' ');
  const parts = [];
  for (const token of raw) {
    if (!token) continue;
    if (token.includes('_')) {
      const punct = token.replace(/_/g, '');
      parts.push({ type: 'slot' });
      if (punct) parts.push({ type: 'text', text: punct });
    } else {
      parts.push({ type: 'text', text: token });
    }
  }
  return parts;
}

function capitalizeFirst(s) {
  const str = String(s||'').trimStart();
  if (!str) return s;
  const idx = str.search(/[A-Za-z]/);
  if (idx === -1) return str;
  return str.slice(0,idx) + str[idx].toUpperCase() + str.slice(idx+1);
}

function firstSlotNeedsCap(parts) {
  for (const p of parts) {
    if (p.type === 'text' && /[A-Za-z]/.test(p.text)) return false;
    if (p.type === 'slot') return true;
  }
  return false;
}

function buildSentence(item, state) {
  const parts = parseTemplate(item.template);
  const capFirst = firstSlotNeedsCap(parts);
  const tokens = [];
  let pos = 0;
  parts.forEach(p => {
    if (p.type === 'text') { tokens.push(p.text); return; }
    const ci = state[pos];
    if (ci !== null && ci !== undefined) {
      tokens.push(capFirst && pos === 0 ? capitalizeFirst(item.chunks[ci]) : item.chunks[ci]);
    } else {
      tokens.push('_____');
    }
    pos++;
  });
  return tokens.join(' ').replace(/\s+([,.;:!?])/g, '$1').trim();
}

function normCompare(text) {
  return String(text||'').replace(/[\u2019\u2018]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/\s+/g,' ').replace(/\s+([,.;:!?])/g,'$1').trim().toLowerCase();
}

// ===== DRAG =====
function createDragGhost(label) {
  if (dragGhostEl) dragGhostEl.remove();
  const g = document.createElement('div'); g.className = 'drag-ghost';
  g.textContent = label;
  document.body.appendChild(g);
  dragGhostEl = g;
}

function moveDragGhost(cx, cy) {
  if (!dragGhostEl) return;
  const ox = pendingDrag?.offsetX ?? 16;
  const oy = pendingDrag?.offsetY ?? 16;
  dragGhostEl.style.left = (cx - ox) + 'px';
  dragGhostEl.style.top = (cy - oy) + 'px';
}

function clearDragging(shouldRender = true) {
  draggingChoiceIdx = null; pendingDrag = null;
  if (dragGhostEl) { dragGhostEl.remove(); dragGhostEl = null; }
  if (shouldRender) { renderTemplate(); renderChoices(); }
}

function beginDragging(choiceIdx, label) {
  if (choiceIdx === null || Number.isNaN(choiceIdx)) return;
  draggingChoiceIdx = choiceIdx;
  createDragGhost(label);
  renderTemplate(); renderChoices();
}

function preparePointerDrag(choiceIdx, event) {
  if (choiceIdx === null || Number.isNaN(choiceIdx)) return;
  const rect = event.currentTarget.getBoundingClientRect();
  pendingDrag = { choiceIdx, label: getItem().chunks[choiceIdx], startX: event.clientX, startY: event.clientY, offsetX: event.clientX - rect.left, offsetY: event.clientY - rect.top };
}

function maybeStartPointerDrag(event) {
  if (!pendingDrag || draggingChoiceIdx !== null) return;
  const dx = event.clientX - pendingDrag.startX, dy = event.clientY - pendingDrag.startY;
  if (Math.hypot(dx, dy) < 6) return;
  suppressClick = true;
  beginDragging(pendingDrag.choiceIdx, pendingDrag.label);
  moveDragGhost(event.clientX, event.clientY);
}

function findNextEmptySlot() {
  const state = ensureState();
  for (let i = 0; i < state.length; i++) { if (state[i] === null) return i; }
  return -1;
}

function placeChoiceInSlot(choiceIdx, slotPos) {
  if (choiceIdx === null || Number.isNaN(choiceIdx) || Number.isNaN(slotPos)) return;
  const state = ensureState();
  const oldPos = state.findIndex(x => x === choiceIdx);
  if (oldPos !== -1) state[oldPos] = null;
  state[slotPos] = choiceIdx;
  clearDragging();
}

function placeChoiceNextSlot(choiceIdx) {
  const slotPos = findNextEmptySlot();
  if (slotPos === -1) return;
  placeChoiceInSlot(choiceIdx, slotPos);
}

function removeChoice(choiceIdx) {
  if (choiceIdx === null || Number.isNaN(choiceIdx)) return;
  const state = ensureState();
  const oldPos = state.findIndex(x => x === choiceIdx);
  if (oldPos !== -1) state[oldPos] = null;
  clearDragging();
}

function finishPointerDrop(cx, cy) {
  if (draggingChoiceIdx === null) return;
  const target = document.elementFromPoint(cx, cy);
  const slot = target?.closest ? target.closest('.slot') : null;
  if (slot) {
    const pos = Number(slot.dataset.slotPos);
    if (!Number.isNaN(pos)) { placeChoiceInSlot(draggingChoiceIdx, pos); return; }
  }
  const choicesArea = target?.closest ? target.closest('#choices') : null;
  if (choicesArea) { removeChoice(draggingChoiceIdx); return; }
  clearDragging();
}

function lockCurrent() { clearDragging(); }

function renderHome() {
  clearDragging(false); stopTimer();
  questionStartTime = null; remaining = null;
  el.timer.textContent = '00:00';
  el.timer.style.display = mode === 'grammar' ? 'none' : '';
  el.sectionCards.innerHTML = '';
  const modeBtn = document.querySelectorAll('.mode-btn');
  modeBtn.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));

  let items = [];
  if (mode === 'grammar') {
    items = Object.keys(grammarSets).sort();
  } else {
    items = Object.keys(testSets).sort();
  }
  items.forEach(label => {
    const ids = mode === 'grammar' ? grammarSets[label] : testSets[label];
    const btn = document.createElement('button');
    btn.className = 'card'; btn.type = 'button';
    const tag = mode === 'grammar' ? `<span class="tag-badge">${ids.length} 题</span>` : '';
    btn.innerHTML = `<h3>${label}</h3><p>${ids.length} 题</p>${tag}`;
    btn.addEventListener('click', () => openSection(label));
    el.sectionCards.appendChild(btn);
  });
  el.viewHome.classList.add('active');
  el.viewPractice.classList.remove('active');
}

function renderQuestionNav() {
  el.questionNav.innerHTML = '';
  sectionItems.forEach((_, idx) => {
    const btn = document.createElement('button'); btn.type = 'button';
    btn.className = 'nav-dot';
    if (idx === itemIdx) btn.classList.add('active');
    const sk = keyFor(currentSectionLabel, idx);
    if (itemScoreState[sk] === 1) btn.classList.add('done');
    if (itemScoreState[sk] === 0 && sectionAutoReviewed) btn.classList.add('wrong');
    btn.textContent = String(idx + 1);
    btn.addEventListener('click', () => openItem(idx));
    el.questionNav.appendChild(btn);
  });
}

function renderTemplate() {
  const item = getItem(); if (!item) return;
  const state = ensureState();
  const parts = parseTemplate(item.template);
  const capFirst = firstSlotNeedsCap(parts);
  el.template.innerHTML = '';
  let slotPos = 0;
  parts.forEach(p => {
    if (p.type === 'text') {
      el.template.appendChild(document.createTextNode(p.text + ' '));
      return;
    }
    const slot = document.createElement('span');
    const ci = state[slotPos];
    const filled = ci !== null;
    slot.className = 'slot' + (filled ? ' filled' : '');
    slot.dataset.slotPos = String(slotPos);
    if (filled) {
      slot.textContent = capFirst && slotPos === 0 ? capitalizeFirst(item.chunks[ci]) : item.chunks[ci];
      slot.addEventListener('mousedown', (e) => {
        e.preventDefault();
        preparePointerDrag(ci, e);
      });
      slot.addEventListener('dblclick', () => { removeChoice(ci); });
    }
    slot.addEventListener('click', (e) => {
      if (suppressClick) { suppressClick = false; return; }
      if (draggingChoiceIdx !== null) { placeChoiceInSlot(draggingChoiceIdx, slotPos); return; }
      if (filled) removeChoice(ci);
    });
    slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('drag-over'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
    slot.addEventListener('drop', e => {
      e.preventDefault(); slot.classList.remove('drag-over');
      const t = e.dataTransfer.getData('text/plain');
      const ci = item.chunks.findIndex(c => c === t);
      if (ci !== -1) placeChoiceInSlot(ci, slotPos);
    });
    el.template.appendChild(slot);
    el.template.appendChild(document.createTextNode(' '));
    slotPos++;
  });
}

function renderChoices() {
  const item = getItem(); if (!item) return;
  const state = ensureState();
  const usedSet = new Set(state.filter(x => x !== null));
  el.choices.innerHTML = '';
  item.chunks.forEach((choice, idx) => {
    if (usedSet.has(idx)) return;
    const chip = document.createElement('button'); chip.type = 'button';
    chip.className = 'chip' + (draggingChoiceIdx === idx ? ' selected' : '');
    chip.textContent = choice;
    chip.draggable = true;
    chip.addEventListener('mousedown', (e) => {
      e.preventDefault();
      preparePointerDrag(idx, e);
    });
    chip.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', choice);
      beginDragging(idx, choice);
    });
    chip.addEventListener('dragend', () => {
      if (draggingChoiceIdx === idx && !Object.values(ensureState()).includes(idx)) clearDragging();
    });
    chip.addEventListener('click', () => {
      if (suppressClick) { suppressClick = false; return; }
      placeChoiceNextSlot(idx);
    });
    el.choices.appendChild(chip);
  });
}

function openSection(label) {
  currentSectionLabel = label;
  const ids = mode === 'grammar' ? grammarSets[label] : testSets[label];
  sectionItems = [...ids];
  itemIdx = 0;
  sectionAutoReviewed = false;
  Object.keys(answersState).forEach(k => { if (k.startsWith(label+'-')) delete answersState[k]; });
  Object.keys(itemScoreState).forEach(k => { if (k.startsWith(label+'-')) delete itemScoreState[k]; });
  stopTimer();
  if (mode === 'test') {
    startCountdown();
  }
  openItem(0);
}

function openItem(idx) {
  itemIdx = idx;
  if (mode === 'grammar') {
    el.timer.style.display = 'none';
  } else {
    el.timer.style.display = '';
  }
  clearDragging(false);
  const item = getItem(); if (!item) return;
  el.prompt.textContent = item.context;
  el.result.className = 'result'; el.result.textContent = '';
  el.result.style.display = 'none';
  renderQuestionNav();
  updateSubmitBtn();
  renderTemplate();
  renderChoices();
  el.viewHome.classList.remove('active');
  el.viewPractice.classList.add('active');
}

function updateSubmitBtn() {
  const last = itemIdx === sectionItems.length - 1;
  el.submitBtn.style.display = last ? '' : 'none';
}

// ===== SCORING =====
function scoreItemAt(idx, updateResult) {
  const item = questions.find(q => q.id === sectionItems[idx]);
  if (!item) return false;
  const key = keyFor(currentSectionLabel, idx);
  const state = answersState[key] || Array(countBlanks(item.template)).fill(null);
  const built = buildSentence(item, state);
  const correct = normCompare(built) === normCompare(item.answer);
  itemScoreState[key] = correct ? 1 : 0;
  if (updateResult && idx === itemIdx) {
    document.querySelectorAll('.slot').forEach(s => {
      s.classList.remove('correct','wrong');
      s.classList.add(correct ? 'correct' : 'wrong');
    });
    el.result.style.display = 'block';
    if (correct) {
      el.result.className = 'result show ok';
      el.result.textContent = '✅ 完全正确！';
    } else {
      el.result.className = 'result show bad';
      el.result.innerHTML = `❌ 不完全正确。<br>参考答案：${item.answer}`;
    }
  }
  return correct;
}

function checkSectionAll(showOnCurrent) {
  sectionAutoReviewed = true;
  let score = 0, total = sectionItems.length;
  for (let i = 0; i < total; i++) {
    if (scoreItemAt(i, i === itemIdx)) score++;
  }
  renderQuestionNav();
  if (showOnCurrent) {
    const item = getItem();
    const correct = itemScoreState[keyFor(currentSectionLabel, itemIdx)] === 1;
    el.result.style.display = 'block';
    el.result.className = 'result show ' + (score === total ? 'ok' : 'bad');
    el.result.textContent = `整套已提交：${total} 题得 ${score} 分。`;
  }
}

function checkCurrent() {
  sectionAutoReviewed = false;
  scoreItemAt(itemIdx, true);
  renderQuestionNav();
}

function resetCurrent() {
  const key = keyFor(currentSectionLabel, itemIdx);
  const item = getItem();
  answersState[key] = Array(countBlanks(item.template)).fill(null);
  itemScoreState[key] = 0;
  sectionAutoReviewed = false;
  el.result.className = 'result'; el.result.textContent = ''; el.result.style.display = 'none';
  renderQuestionNav(); renderTemplate(); renderChoices();
}

// ===== EVENTS =====
function bindEvents() {
  el.homeBtn.addEventListener('click', () => { stopTimer(); renderHome(); });

  el.prevBtn.addEventListener('click', () => { if (itemIdx > 0) openItem(itemIdx - 1); });
  el.nextBtn.addEventListener('click', () => { if (itemIdx < sectionItems.length - 1) openItem(itemIdx + 1); });
  el.checkBtn.addEventListener('click', checkCurrent);
  el.submitBtn.addEventListener('click', () => checkSectionAll(true));
  el.resetBtn.addEventListener('click', resetCurrent);

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      mode = btn.dataset.mode;
      renderHome();
    });
  });

  document.addEventListener('mousemove', (e) => {
    maybeStartPointerDrag(e);
    moveDragGhost(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup', (e) => {
    if (draggingChoiceIdx !== null) { finishPointerDrop(e.clientX, e.clientY); return; }
    pendingDrag = null;
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') clearDragging(); });
}

// ===== INIT =====
bindEvents();
renderHome();
</script>
</body>
</html>
